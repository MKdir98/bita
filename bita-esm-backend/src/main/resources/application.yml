spring:
  application:
    name: bita-esm-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # Database
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bita_db}
    username: ${DB_USERNAME:bita}
    password: ${DB_PASSWORD:bita123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 60000

  # Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: esm-backend
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: ir.bita.common.event

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# Server
server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /

# Management / Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

# Application specific
app:
  version: 1.0.0
  jwt:
    secret: ${JWT_SECRET:bita-jwt-secret-key-change-in-production-minimum-256-bits}
    access-token-expiration: 3600000  # 1 hour
    refresh-token-expiration: 604800000  # 7 days
  otp:
    length: 6
    expiration-minutes: 5
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  internal:
    api-key: ${INTERNAL_API_KEY:internal-api-key-change-in-production}
  file:
    storage-path: ${FILE_STORAGE_PATH:/var/bita/route-files}
  llm:
    # === Paid/API Key Providers ===
    openai:
      enabled: ${OPENAI_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
    ollama:
      enabled: ${OLLAMA_ENABLED:false}
      url: ${OLLAMA_URL:http://localhost:11434}
      model: llama3
    
    # === Free Providers (no API key required, no setup needed) ===
    # BoofAI (Shaboof) - Iranian LLM, Persian-optimized!
    boofai:
      enabled: ${BOOFAI_ENABLED:true}
    
    # Gradient Network - GPT-OSS-120B
    gradient:
      enabled: ${GRADIENT_ENABLED:false}
    
    # Yqcloud - may hit rate limits
    yqcloud:
      enabled: ${YQCLOUD_ENABLED:false}
    
    startnest:
      enabled: ${STARTNEST_ENABLED:false}
    
    # === G4F Providers (requires: python -m g4f --port 1337) ===
    cohere:
      enabled: ${COHERE_ENABLED:false}
    meta:
      enabled: ${META_ENABLED:false}
    deepseek:
      enabled: ${DEEPSEEK_ENABLED:false}

# Logging
logging:
  level:
    root: INFO
    ir.bita: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
