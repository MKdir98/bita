apiVersion: apps/v1
kind: Deployment
metadata:
  name: bita-esm-frontend
  namespace: bita
  labels:
    app.kubernetes.io/name: bita-esm-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: bita-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: bita-esm-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bita-esm-frontend
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: bita-esm-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: bita-esm-frontend
  namespace: bita
  labels:
    app.kubernetes.io/name: bita-esm-frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: bita-esm-frontend
