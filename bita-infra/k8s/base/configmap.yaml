apiVersion: v1
kind: ConfigMap
metadata:
  name: bita-config
  namespace: bita
  labels:
    app.kubernetes.io/name: bita
data:
  # Database
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/bita"
  
  # Redis
  SPRING_REDIS_HOST: "redis"
  SPRING_REDIS_PORT: "6379"
  
  # Kafka
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  
  # Elasticsearch
  ELASTICSEARCH_URL: "http://elasticsearch:9200"
  
  # Application
  SPRING_PROFILES_ACTIVE: "production"
  SERVER_PORT: "8080"
  
  # JPA
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_JPA_SHOW_SQL: "false"
  
  # Logging
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_IR_BITA: "INFO"
