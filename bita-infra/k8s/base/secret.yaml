apiVersion: v1
kind: Secret
metadata:
  name: bita-secrets
  namespace: bita
  labels:
    app.kubernetes.io/name: bita
type: Opaque
stringData:
  # Database credentials (base64 encoded in real deployment)
  SPRING_DATASOURCE_USERNAME: "bita"
  SPRING_DATASOURCE_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  
  # Redis password
  SPRING_REDIS_PASSWORD: ""
  
  # JWT secret
  JWT_SECRET: "CHANGE_ME_USE_SECURE_RANDOM_VALUE_IN_PRODUCTION"
  
  # Internal API key for ESB Core
  INTERNAL_API_KEY: "CHANGE_ME_USE_SECURE_RANDOM_VALUE"
  
  # LLM API keys
  OPENAI_API_KEY: ""
  OLLAMA_BASE_URL: "http://ollama:11434"
