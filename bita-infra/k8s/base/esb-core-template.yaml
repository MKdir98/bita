# ESB Core Deployment Template
# This is a template - actual deployments are created dynamically by ESM Backend
# Each service gets its own ESB Core deployment with a unique SERVICE_ID

apiVersion: apps/v1
kind: Deployment
metadata:
  name: bita-esb-${SERVICE_ID}
  namespace: bita
  labels:
    app.kubernetes.io/name: bita-esb-core
    app.kubernetes.io/component: esb
    app.kubernetes.io/part-of: bita-platform
    bita.ir/service-id: "${SERVICE_ID}"
spec:
  replicas: ${MIN_REPLICAS}
  selector:
    matchLabels:
      app.kubernetes.io/name: bita-esb-core
      bita.ir/service-id: "${SERVICE_ID}"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bita-esb-core
        app.kubernetes.io/component: esb
        bita.ir/service-id: "${SERVICE_ID}"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: esb-core
          image: bita-esb-core:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SERVICE_ID
              value: "${SERVICE_ID}"
            - name: ESM_BASE_URL
              value: "http://bita-esm-backend:8080"
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: bita-config
                  key: SPRING_KAFKA_BOOTSTRAP_SERVERS
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: bita-config
                  key: SPRING_REDIS_HOST
            - name: ELASTICSEARCH_URL
              valueFrom:
                configMapKeyRef:
                  name: bita-config
                  key: ELASTICSEARCH_URL
            - name: ESM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bita-secrets
                  key: INTERNAL_API_KEY
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: bita-esb-${SERVICE_ID}
  namespace: bita
  labels:
    app.kubernetes.io/name: bita-esb-core
    bita.ir/service-id: "${SERVICE_ID}"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: bita-esb-core
    bita.ir/service-id: "${SERVICE_ID}"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bita-esb-${SERVICE_ID}
  namespace: bita
  labels:
    app.kubernetes.io/name: bita-esb-core
    bita.ir/service-id: "${SERVICE_ID}"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bita-esb-${SERVICE_ID}
  minReplicas: ${MIN_REPLICAS}
  maxReplicas: ${MAX_REPLICAS}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: ${TARGET_CPU_PERCENT}
