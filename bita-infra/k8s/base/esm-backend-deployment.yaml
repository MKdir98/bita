apiVersion: apps/v1
kind: Deployment
metadata:
  name: bita-esm-backend
  namespace: bita
  labels:
    app.kubernetes.io/name: bita-esm-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: bita-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: bita-esm-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bita-esm-backend
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: bita-esm-backend
      containers:
        - name: esm-backend
          image: bita-esm-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: bita-config
            - secretRef:
                name: bita-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: bita-esm-backend
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: bita-esm-backend
  namespace: bita
  labels:
    app.kubernetes.io/name: bita-esm-backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: bita-esm-backend
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bita-esm-backend
  namespace: bita
  labels:
    app.kubernetes.io/name: bita-esm-backend
