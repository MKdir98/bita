apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bita-dev

resources:
  - ../../base

namePrefix: dev-

commonLabels:
  environment: development

replicas:
  - name: bita-esm-backend
    count: 1
  - name: bita-esm-frontend
    count: 1

patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"
    target:
      kind: Deployment
      name: bita-esm-backend

configMapGenerator:
  - name: bita-config
    behavior: merge
    literals:
      - SPRING_PROFILES_ACTIVE=development
      - LOGGING_LEVEL_IR_BITA=DEBUG
      - SPRING_JPA_SHOW_SQL=true
