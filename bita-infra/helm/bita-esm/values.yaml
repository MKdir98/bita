# Default values for bita-esm

# Global settings
global:
  namespace: bita
  environment: production

# ESM Backend
backend:
  enabled: true
  replicaCount: 2
  
  image:
    repository: bita-esm-backend
    tag: latest
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 8080
  
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilization: 70
  
  # Liveness and readiness probes
  livenessProbe:
    path: /actuator/health/liveness
    initialDelaySeconds: 60
    periodSeconds: 10
  
  readinessProbe:
    path: /actuator/health/readiness
    initialDelaySeconds: 30
    periodSeconds: 5

# ESM Frontend
frontend:
  enabled: true
  replicaCount: 2
  
  image:
    repository: bita-esm-frontend
    tag: latest
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 80
  
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: bita.local
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend
  tls:
    - secretName: bita-tls
      hosts:
        - bita.local

# Database configuration
database:
  host: postgres
  port: 5432
  name: bita
  username: bita
  # Password should be provided via secrets
  existingSecret: bita-secrets
  passwordKey: SPRING_DATASOURCE_PASSWORD

# Redis configuration
redis:
  host: redis
  port: 6379
  password: ""

# Kafka configuration
kafka:
  bootstrapServers: kafka:9092

# Elasticsearch configuration
elasticsearch:
  url: http://elasticsearch:9200

# Application settings
spring:
  profiles: production
  jpa:
    ddlAuto: update
    showSql: false
  
logging:
  level:
    root: INFO
    ir.bita: INFO

# JWT settings
jwt:
  # Secret should be provided via secrets
  existingSecret: bita-secrets
  secretKey: JWT_SECRET
  expiration: 86400000
  refreshExpiration: 604800000

# Service account
serviceAccount:
  create: true
  name: ""
  annotations: {}

# Pod annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"

# Pod security context
podSecurityContext: {}

# Container security context  
securityContext: {}

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}
